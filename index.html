<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Type what you ate in plain language, get grams of protein.">
<title>Fuzzy Protein</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<!-- iOS home-screen app. status-bar-style "default" keeps the status bar its own
     black-on-white strip; "black-translucent" would put white text on our white page. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Protein">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
    min-height: 100vh;
    /* Keep clear of the notch and the home indicator when installed. */
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 28rem; margin: 0 auto; padding: 0 20px 64px; }

  header { padding-top: 32px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
  .date { font-size: 14px; color: #6b6b6b; margin-top: 4px; }
  .rule-8 { height: 8px; background: #111; margin-top: 12px; }
  .rule-4 { height: 4px; background: #111; }

  .link-btn {
    background: none; border: none; font: inherit; cursor: pointer;
    font-size: 14px; color: #6b6b6b;
    text-decoration: underline; text-underline-offset: 4px;
  }

  /* Settings */
  #settings { margin-top: 16px; border: 2px solid #111; padding: 14px; display: none; }
  #settings.open { display: block; }
  #settings h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  #settings p { font-size: 13px; color: #6b6b6b; margin-top: 6px; line-height: 1.4; }
  .settings-row { display: flex; gap: 8px; margin-top: 10px; }
  .field-col { flex: 1; min-width: 0; }
  .field-col .field-label { margin-top: 0; margin-bottom: 4px; }
  #api-key-input, #model-input, #provider-select, #thinking-select, #effort-input {
    flex: 1; min-width: 0; border: 2px solid #111; padding: 8px 10px;
    font: inherit; font-size: 14px; background: #fff; color: #111; border-radius: 0;
  }
  #api-key-input:focus, #model-input:focus, #provider-select:focus,
  #thinking-select:focus, #effort-input:focus {
    outline: 2px solid #111; outline-offset: 1px;
  }
  #thinking-select, #effort-input { width: 100%; }
  #api-key-save { width: 100%; }
  .field-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: #6b6b6b; margin-top: 12px;
  }

  .btn-solid {
    background: #111; color: #fff; border: none; font: inherit; font-weight: 700;
    padding: 8px 14px; cursor: pointer; font-size: 14px;
  }

  /* Total vs goal */
  .total-section { padding-top: 16px; }
  .total-row { display: flex; align-items: flex-end; justify-content: space-between; }
  .label-tiny { font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; color: #6b6b6b; }
  #total {
    font-size: 64px; font-weight: 900; letter-spacing: -0.03em; line-height: 1;
  }
  #total .unit { font-size: 24px; font-weight: 700; }
  .hit { color: #1b7a43; }
  .goal-area { text-align: right; padding-bottom: 4px; }
  #goal-edit { display: none; align-items: center; gap: 8px; }
  #goal-edit.open { display: flex; }
  #goal-edit.open + #goal-show { display: none; }
  #goal-input {
    width: 80px; border: 2px solid #111; padding: 6px 8px; text-align: right;
    font: inherit; font-weight: 700; font-size: 15px;
  }
  #bar-track { height: 14px; background: #ececec; margin-top: 12px; }
  #bar-fill { height: 100%; width: 0; background: #111; transition: width 400ms ease; }
  #bar-fill.hit-bg { background: #1b7a43; }
  #goal-msg { margin-top: 8px; font-size: 14px; font-weight: 700; color: #1b7a43; display: none; }

  /* Input */
  .entry { margin-top: 24px; }
  .entry-box { border: 2px solid #111; }
  #food-input {
    display: block; width: 100%; border: none; resize: none;
    padding: 12px; font: inherit; font-size: 16px;
  }
  #food-input:focus { outline: none; }
  #log-btn {
    display: block; width: 100%; background: #111; color: #fff; border: none;
    font: inherit; font-weight: 700; font-size: 16px; padding: 12px; cursor: pointer;
  }
  #error {
    margin-top: 8px; font-size: 14px; font-weight: 700; color: #b3261e; display: none;
    white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35;
    user-select: text; -webkit-user-select: text;
  }

  /* Pending queue — entries captured but not yet parsed */
  #pending { list-style: none; margin-top: 12px; }
  #pending li {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding: 10px 12px; margin-top: 8px;
    border: 2px dashed #bdbdbd;
  }
  #pending li.failed { border-style: solid; border-color: #b3261e; }
  .pend-left { min-width: 0; flex: 1; }
  .pend-text { font-weight: 700; overflow-wrap: anywhere; }
  .pend-meta {
    margin-top: 4px; font-size: 13px; color: #6b6b6b; line-height: 1.35;
    overflow-wrap: anywhere; white-space: pre-wrap;
    user-select: text; -webkit-user-select: text;
  }
  #pending li.failed .pend-meta { color: #b3261e; font-weight: 700; }
  .pend-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pend-retry {
    background: none; border: 2px solid #111; font: inherit; font-size: 13px;
    font-weight: 700; padding: 4px 8px; cursor: pointer;
  }
  .pend-del {
    background: none; border: none; font: inherit; font-size: 18px;
    line-height: 1; padding: 0 2px; color: #6b6b6b; cursor: pointer;
  }
  #offline-note { margin-top: 8px; font-size: 13px; color: #6b6b6b; display: none; }

  /* Items */
  .items-section { margin-top: 24px; }
  #empty-msg { padding: 16px 0; font-size: 14px; color: #6b6b6b; }
  #items { list-style: none; }
  #items li {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid #dcdcdc;
  }
  .item-name { font-weight: 700; }
  .item-amount { margin-left: 8px; font-size: 14px; color: #6b6b6b; }
  .item-left { padding-right: 12px; min-width: 0; }
  .item-right { display: flex; align-items: baseline; gap: 12px; flex-shrink: 0; }
  .item-grams { font-weight: 900; font-variant-numeric: tabular-nums; }
  .item-del {
    background: none; border: none; cursor: pointer; font-size: 18px;
    line-height: 1; padding: 0 4px; color: #6b6b6b;
  }

  /* Week chart */
  .week-section { margin-top: 32px; }
  .week-head { padding-top: 12px; }
  #week { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 12px; height: 72px; }
  .day-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .day-bar { width: 100%; background: #bdbdbd; }
  .day-bar.today { background: #111; }
  .day-bar.hit-bg { background: #1b7a43; }
  .day-label { margin-top: 4px; font-size: 12px; color: #6b6b6b; }
  .day-label.today { color: #111; font-weight: 700; }

  .footnote { margin-top: 16px; font-size: 12px; color: #6b6b6b; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-row">
      <h1>Fuzzy Protein</h1>
      <button id="settings-toggle" class="link-btn" type="button">settings</button>
    </div>
    <p class="date" id="date-label"></p>
    <div class="rule-8"></div>
  </header>

  <section id="settings">
    <h2>Provider</h2>
    <div class="settings-row">
      <select id="provider-select"></select>
    </div>
    <div class="field-label">API key</div>
    <div class="settings-row">
      <input id="api-key-input" type="password" placeholder="" autocomplete="off">
    </div>
    <div class="field-label">Model <span>(optional)</span></div>
    <div class="settings-row">
      <input id="model-input" type="text" placeholder="" autocomplete="off" spellcheck="false">
    </div>
    <div class="settings-row">
      <div class="field-col">
        <div class="field-label">Thinking</div>
        <select id="thinking-select">
          <option value="">provider default</option>
          <option value="on">on</option>
          <option value="off">off</option>
        </select>
      </div>
      <div class="field-col">
        <div class="field-label">Effort</div>
        <input id="effort-input" type="text" list="effort-options" placeholder="provider default"
               autocomplete="off" spellcheck="false">
        <datalist id="effort-options"></datalist>
      </div>
    </div>
    <div class="settings-row">
      <button id="api-key-save" class="btn-solid" type="button">Save</button>
    </div>
    <p id="settings-note"></p>
  </section>

  <section class="total-section">
    <div class="total-row">
      <div>
        <div class="label-tiny">today</div>
        <div id="total">0<span class="unit"> g</span></div>
      </div>
      <div class="goal-area">
        <div id="goal-edit">
          <input id="goal-input" type="number" min="1" inputmode="numeric">
          <button id="goal-save" class="btn-solid" type="button">Set</button>
        </div>
        <button id="goal-show" class="link-btn" type="button"></button>
      </div>
    </div>
    <div id="bar-track"><div id="bar-fill"></div></div>
    <p id="goal-msg">Goal reached.</p>
  </section>

  <section class="entry">
    <div class="entry-box">
      <textarea id="food-input" rows="2"
        placeholder="4 fried eggs, 2 spoons of sauerkraut…"></textarea>
      <button id="log-btn" type="button">Log it</button>
    </div>
    <p id="error"></p>
    <p id="offline-note">Offline — queued entries send when you're back online.</p>
    <ul id="pending"></ul>
  </section>

  <section class="items-section">
    <div class="rule-4"></div>
    <p id="empty-msg">Nothing logged yet. Type what you ate.</p>
    <ul id="items"></ul>
  </section>

  <section class="week-section">
    <div class="rule-8"></div>
    <div class="week-head">
      <span class="label-tiny">last 7 days</span>
    </div>
    <div id="week"></div>
    <p class="footnote">Estimates are approximate. Values in grams.</p>
  </section>

</div>

<script>
"use strict";

// ---------- providers ----------
// Each provider maps the same request/response contract onto its own wire format.
// opts = { thinking: "" | "on" | "off", effort: "" | <any string> }.
// "" means send nothing and let the provider apply its own default. Values are
// passed through verbatim — no whitelist here, so new API values keep working.
var THINKING_BUDGET = 4000; // room for reasoning tokens when thinking is on

// The messages-shaped body Anthropic and the OpenAI-compatible providers agree on.
// Only the "thinking on" type string and where effort lands actually differ, so
// those get layered on by the caller.
function chatBody(model, prompt, opts) {
  var body = {
    model: model,
    max_tokens: opts.thinking === "on" ? THINKING_BUDGET : 500,
    messages: [{ role: "user", content: prompt }]
  };
  if (opts.thinking === "off") body.thinking = { type: "disabled" };
  return body;
}

var PROVIDERS = {
  anthropic: {
    label: "Anthropic (Claude)",
    host: "api.anthropic.com",
    model: "claude-haiku-4-5-20251001",
    keyHint: "sk-ant-…",
    // Suggestions only — the field accepts anything and sends it verbatim.
    efforts: ["low", "medium", "high", "xhigh", "max"],
    effortNote: "output_config.effort — Claude 4.6+ only (xhigh: 4.7+). Haiku 4.5 has no effort setting.",
    request: function (key, model, prompt, opts) {
      var body = chatBody(model, prompt, opts);
      // Adaptive thinking is the current form on Claude 4.6+; older models
      // (incl. the default Haiku 4.5) will reject it — the error is shown as-is.
      if (opts.thinking === "on") body.thinking = { type: "adaptive" };
      if (opts.effort) body.output_config = { effort: opts.effort };
      return {
        url: "https://api.anthropic.com/v1/messages",
        headers: {
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "content-type": "application/json",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: body
      };
    },
    extract: function (data) {
      return (data.content || [])
        .filter(function (b) { return b.type === "text"; })
        .map(function (b) { return b.text; })
        .join("\n");
    }
  },

  deepseek: {
    label: "DeepSeek",
    host: "api.deepseek.com",
    model: "deepseek-chat",
    keyHint: "sk-…",
    efforts: ["high", "max"],
    effortNote: "reasoning_effort — only high and max are distinct (low/medium map to high, xhigh to max).",
    request: function (key, model, prompt, opts) {
      return openaiRequest("https://api.deepseek.com/chat/completions", key, model, prompt, opts);
    },
    extract: openaiExtract
  },

  kimi: {
    label: "Kimi (Moonshot)",
    host: "api.moonshot.ai",
    model: "kimi-latest",
    keyHint: "sk-…",
    efforts: [],
    effortNote: "reasoning_effort — not documented by Moonshot; may be ignored or rejected.",
    request: function (key, model, prompt, opts) {
      return openaiRequest("https://api.moonshot.ai/v1/chat/completions", key, model, prompt, opts);
    },
    extract: openaiExtract
  },

  gemini: {
    label: "Google Gemini",
    host: "generativelanguage.googleapis.com",
    model: "gemini-2.5-flash",
    keyHint: "AIza…",
    efforts: ["low", "high"],
    effortNote: "thinkingConfig.thinkingLevel — Gemini 3+ only; 2.5 uses a numeric thinkingBudget instead.",
    request: function (key, model, prompt, opts) {
      var cfg = {
        responseMimeType: "application/json",
        maxOutputTokens: opts.thinking === "off" ? 2000 : THINKING_BUDGET
      };
      // thinkingBudget: 0 disables, -1 lets the model decide.
      if (opts.thinking === "off") cfg.thinkingConfig = { thinkingBudget: 0 };
      // Gemini 3+ calls the effort dial thinkingLevel; the value is sent verbatim.
      // thinkingLevel and thinkingBudget are mutually exclusive, so effort wins.
      if (opts.effort) cfg.thinkingConfig = { thinkingLevel: opts.effort };
      else if (opts.thinking === "on") cfg.thinkingConfig = { thinkingBudget: -1 };
      return {
        url: "https://generativelanguage.googleapis.com/v1beta/models/" +
             encodeURIComponent(model) + ":generateContent",
        headers: {
          "x-goog-api-key": key,
          "content-type": "application/json"
        },
        body: {
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: cfg
        }
      };
    },
    extract: function (data) {
      var cand = (data.candidates || [])[0];
      var parts = (cand && cand.content && cand.content.parts) || [];
      return parts.map(function (p) { return p.text || ""; }).join("\n");
    }
  }
};

// OpenAI-compatible chat/completions shape, shared by DeepSeek and Kimi.
function openaiRequest(url, key, model, prompt, opts) {
  var body = chatBody(model, prompt, opts);
  if (opts.thinking === "on") body.thinking = { type: "enabled" };
  if (opts.effort) body.reasoning_effort = opts.effort;
  return {
    url: url,
    headers: {
      "authorization": "Bearer " + key,
      "content-type": "application/json"
    },
    body: body
  };
}
function openaiExtract(data) {
  var choice = (data.choices || [])[0];
  return (choice && choice.message && choice.message.content) || "";
}

var PROVIDER_IDS = Object.keys(PROVIDERS);
var DEFAULT_PROVIDER = "anthropic";

// ---------- storage ----------
var KEY_GOAL = "protein.goal";
var KEY_DAYS = "protein.days";
var KEY_PROVIDER = "protein.provider";
var KEY_QUEUE = "protein.queue";
var MAX_ATTEMPTS = 3;
var STORAGE_FAIL = "Saving failed — storage unavailable.";

// Per-provider settings live under "protein.<field>.<provider>". One exception:
// Anthropic's key keeps its original name so existing installs keep working.
function storageKey(field, id) {
  if (field === "apiKey" && id === "anthropic") return "protein.apiKey";
  return "protein." + field + "." + id;
}

// localStorage can be absent, full, or hold something we didn't write. Reads fall
// back to an empty value; writes report failure so the caller can say so.
function loadJSON(key, fallback, isValid) {
  try {
    var v = JSON.parse(localStorage.getItem(key));
    return isValid(v) ? v : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
// An empty settings field means "no override" — drop the key rather than store "".
function setOrClear(field, id, value) {
  if (value) localStorage.setItem(storageKey(field, id), value);
  else localStorage.removeItem(storageKey(field, id));
}

function provider() {
  var id = localStorage.getItem(KEY_PROVIDER);
  return PROVIDERS[id] ? id : DEFAULT_PROVIDER;
}
function apiKey(id) { return localStorage.getItem(storageKey("apiKey", id || provider())) || ""; }
function modelFor(id) {
  id = id || provider();
  return (localStorage.getItem(storageKey("model", id)) || "").trim() || PROVIDERS[id].model;
}
function optsFor(id) {
  id = id || provider();
  return {
    thinking: localStorage.getItem(storageKey("thinking", id)) || "",
    effort: (localStorage.getItem(storageKey("effort", id)) || "").trim()
  };
}

function isObject(v) { return !!v && typeof v === "object"; }
function loadDays() { return loadJSON(KEY_DAYS, {}, isObject); }
function saveDays(days) { return saveJSON(KEY_DAYS, days); }
function loadGoal() {
  var g = parseInt(localStorage.getItem(KEY_GOAL), 10);
  return g > 0 ? g : 200;
}

// ---------- queue ----------
// Every submission lands here first and is only removed once it has been parsed
// and written into a day. One code path online and off, and nothing is lost if
// the tab dies mid-request. Entry: {id, text, date, createdAt, attempts, error, parked}.
function loadQueue() { return loadJSON(KEY_QUEUE, [], Array.isArray); }
function saveQueue(q) { return saveJSON(KEY_QUEUE, q); }
function updateQueue(fn) {
  var q = loadQueue();
  var next = fn(q);
  return saveQueue(next || q);
}
function newId() {
  return crypto.randomUUID ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// ---------- dates ----------
function fmt(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}
function todayKey() { return fmt(new Date()); }

// ---------- parsing ----------
var PARSE_PROMPT = [
  'You are a protein estimator. The input is a casual, fuzzy description of food someone ate,',
  'in any language, with vague amounts allowed. Split it into items and estimate the grams of',
  'protein in each, using realistic metric portions.',
  '',
  'Rules:',
  '- Respond with ONLY a raw JSON array. No markdown fences, no prose, no text before or after.',
  '- Schema: [{"name": string, "amount": string, "protein_g": number}]',
  '- protein_g is a whole number >= 0 for the whole stated amount, not per unit.',
  '- One object per food mentioned, in the order mentioned. Never merge items and never drop one:',
  '  list near-zero foods (butter, oil, most vegetables) with protein_g 0.',
  '- amount is short and concrete and states the metric weight you assumed, e.g. "3 slices, ~135 g".',
  '- Resolve fuzzy units to typical portions: slice of bread ~45 g, spoon ~15 g, handful ~30 g,',
  '  bowl ~250 g, glass ~200 ml, "a bit" / "a little" ~10 g.',
  '- A gram figure is the weight of the food unless it is explicitly called protein',
  '  (protein, Eiweiss, EW). A stated protein figure is useful evidence — often it is read off',
  '  the packaging — so let it carry real weight, and multiply it out if it is per unit. But the',
  '  answer is yours: never just pass a number through. Judge it against the food first.',
  '- Sanity-check every number against what you know about that specific food. If a figure is not',
  '  plausible for it, something was misread (often a weight taken for protein, or the user simply',
  '  got it wrong) — go with your own estimate. Round to the nearest whole gram.',
  '- Name the food the user named. Do not upgrade or specialise it: "1 Riegel mit 7 g Protein"',
  '  is a "Riegel", not a "Proteinriegel".',
  '- Keep names short and capitalized. Keep the local name for regional products (Bauernbrot, Magerquark).',
  '',
  'Example input: "4 fried eggs, 3 slices of Bauernbrot, a bit of butter, and 2 thin slices of camembert"',
  'Example output:',
  '[{"name":"Fried eggs","amount":"4 eggs, ~220 g","protein_g":25},',
  ' {"name":"Bauernbrot","amount":"3 slices, ~135 g","protein_g":10},',
  ' {"name":"Butter","amount":"~10 g","protein_g":0},',
  ' {"name":"Camembert","amount":"2 thin slices, ~40 g","protein_g":8}]',
  '',
  'Example input: "250 g joghurt + 200 g magerquark"',
  'Example output:',
  '[{"name":"Joghurt","amount":"250 g","protein_g":11},',
  ' {"name":"Magerquark","amount":"200 g","protein_g":19}]',
  '',
  'Example input: "1 riegel mit 7.3 g protein"   (protein stated, so use it)',
  'Example output:',
  '[{"name":"Riegel","amount":"1 Riegel","protein_g":7}]',
  '',
  'These four inputs all describe the same meal and must all give the same protein figure.',
  'A slice of Bündnerfleisch weighs about 6 g and holds about 2.5 g of protein, so 4 slices',
  'are ~24 g of meat and ~10 g of protein — whether the user states the weight, the protein,',
  'or nothing at all:',
  '  "4 scheiben bündnerfleisch"                        -> [{"name":"Bündnerfleisch","amount":"4 Scheiben, ~24 g","protein_g":10}]',
  '  "4 scheiben bündnerfleisch zu je 6 g"              -> [{"name":"Bündnerfleisch","amount":"4 Scheiben, 24 g","protein_g":10}]',
  '  "4 scheiben bündnerfleisch mit je 2.5 g protein"   -> [{"name":"Bündnerfleisch","amount":"4 Scheiben, ~24 g","protein_g":10}]',
  '  "bündnerfleisch mit 10 g protein"                  -> [{"name":"Bündnerfleisch","amount":"~24 g","protein_g":10}]',
  '',
  'Example input: "1 scheibe brot mit 40 g protein"   (impossible for one slice, so estimate it)',
  'Example output:',
  '[{"name":"Brot","amount":"1 Scheibe, ~45 g","protein_g":4}]',
  '',
  'Now do the same for this input: '
].join("\n");

// Every failure says how it should be retried, decided here where the cause is
// actually known rather than re-derived later from a status code:
//   "defer"    — never reached the provider, so it costs no attempt; wait for the
//                next trigger (reconnect, reopen).
//   "soft"     — worth another go later; burns an attempt.
//   "terminal" — the provider understood us and said no; retrying asks the same
//                question and gets the same answer.
function apiError(msg, retry) {
  var err = new Error(msg);
  err.retry = retry;
  return err;
}

async function parseFood(text) {
  var id = provider();
  var p = PROVIDERS[id];
  var req = p.request(apiKey(id), modelFor(id), PARSE_PROMPT + JSON.stringify(text), optsFor(id));

  var res;
  try {
    res = await fetch(req.url, {
      method: "POST",
      headers: req.headers,
      body: JSON.stringify(req.body)
    });
  } catch (e) {
    // fetch only rejects on network/CORS failure, never on HTTP error status.
    // The request never landed, so nothing was charged or logged.
    throw apiError("Couldn't reach " + p.host +
      " — network error, or the provider blocks browser requests (CORS).", "defer");
  }

  var bodyText = "";
  try { bodyText = await res.text(); } catch (e) {}
  var data = null;
  try { data = JSON.parse(bodyText); } catch (e) {}

  if (!res.ok) {
    // Surface whatever the provider said, verbatim — never swallow or reinterpret it.
    var msg = (data && data.error && (data.error.message || data.error)) ||
              (data && data.message) || bodyText || "no response body";
    if (typeof msg !== "string") msg = JSON.stringify(msg);
    // A 4xx is the provider's considered "no". Rate limits, timeouts and server
    // errors are the ones where the same request can still succeed later.
    var soft = res.status < 400 || res.status >= 500 ||
               res.status === 408 || res.status === 429;
    throw apiError(p.host + " HTTP " + res.status + ": " + msg, soft ? "soft" : "terminal");
  }

  var raw = p.extract(data || {});
  var clean = raw.replace(/```json|```/g, "").trim();

  var arr;
  try {
    arr = JSON.parse(clean);
  } catch (e) {
    throw apiError("Model did not return JSON. Response: " + (clean || bodyText || "empty"), "soft");
  }
  if (!Array.isArray(arr)) {
    throw apiError("Expected a JSON array. Response: " + clean, "soft");
  }

  return arr
    .filter(function (x) { return x && typeof x.name === "string"; })
    .map(function (x) {
      return {
        id: newId(),
        name: x.name,
        amount: String(x.amount == null ? "" : x.amount),
        protein: Math.max(0, Math.round(Number(x.protein_g) || 0))
      };
    });
}

// ---------- elements ----------
var $ = function (id) { return document.getElementById(id); };
var settingsEl = $("settings"), keyInput = $("api-key-input");
var providerSelect = $("provider-select"), modelInput = $("model-input");
var settingsNote = $("settings-note");
var thinkingSelect = $("thinking-select"), effortInput = $("effort-input");
var effortOptions = $("effort-options");
var totalEl = $("total"), goalShow = $("goal-show"), goalEdit = $("goal-edit"), goalInput = $("goal-input");
var barFill = $("bar-fill"), goalMsg = $("goal-msg");
var foodInput = $("food-input"), logBtn = $("log-btn"), errorEl = $("error");
var itemsEl = $("items"), emptyMsg = $("empty-msg"), weekEl = $("week");
var pendingEl = $("pending"), offlineNote = $("offline-note");

// ---------- rendering ----------
// The three lists below all build the same create → class → text → append shape.
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function delButton(cls, label, onClick) {
  var b = el("button", cls, "×");
  b.type = "button";
  b.setAttribute("aria-label", label);
  b.addEventListener("click", onClick);
  return b;
}
function sumProtein(items) {
  return items.reduce(function (s, i) { return s + i.protein; }, 0);
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = msg ? "block" : "none";
}

function render() {
  var days = loadDays();
  var goal = loadGoal();
  var items = days[todayKey()] || [];
  var total = sumProtein(items);
  var hit = total >= goal;

  // date
  $("date-label").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", day: "numeric", month: "long"
  });

  // total + goal
  totalEl.innerHTML = total + '<span class="unit"> g</span>';
  totalEl.classList.toggle("hit", hit);
  goalShow.textContent = "goal " + goal + " g";
  var pct = Math.min(100, (total / goal) * 100);
  barFill.style.width = pct + "%";
  barFill.classList.toggle("hit-bg", hit);
  goalMsg.style.display = hit ? "block" : "none";

  // items
  itemsEl.innerHTML = "";
  emptyMsg.style.display = items.length ? "none" : "block";
  items.forEach(function (it) {
    var left = el("div", "item-left");
    left.appendChild(el("span", "item-name", it.name));
    if (it.amount) left.appendChild(el("span", "item-amount", it.amount));

    var right = el("div", "item-right");
    right.appendChild(el("span", "item-grams", it.protein + " g"));
    right.appendChild(delButton("item-del", "Remove " + it.name, function () { removeItem(it.id); }));

    var li = el("li");
    li.appendChild(left);
    li.appendChild(right);
    itemsEl.appendChild(li);
  });

  renderPending();

  // week chart
  weekEl.innerHTML = "";
  var labels = ["S", "M", "T", "W", "T", "F", "S"];
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    var isToday = i === 0;
    var dayTotal = isToday ? total : sumProtein(days[fmt(d)] || []);

    var bar = el("div", "day-bar" + (dayTotal >= goal ? " hit-bg" : isToday ? " today" : ""));
    bar.style.height = Math.max(3, Math.min(1, dayTotal / goal) * 56) + "px";
    bar.title = dayTotal + " g";

    var col = el("div", "day-col");
    col.appendChild(bar);
    col.appendChild(el("span", "day-label" + (isToday ? " today" : ""), labels[d.getDay()]));
    weekEl.appendChild(col);
  }
}

// Pending entries live outside the day totals: their protein is unknown until
// parsed, so counting them would make the headline number lie. They are listed
// separately, and carry their own date because an entry queued last night must
// land on last night's day even if it only sends this morning.
function renderPending() {
  var q = loadQueue();
  pendingEl.innerHTML = "";
  offlineNote.style.display = (!navigator.onLine && q.length) ? "block" : "none";

  q.forEach(function (e) {
    var left = el("div", "pend-left");
    left.appendChild(el("div", "pend-text", e.text));
    left.appendChild(el("div", "pend-meta", pendingStatus(e)));

    var right = el("div", "pend-right");
    if (e.parked) {
      var retry = el("button", "pend-retry", "Retry");
      retry.type = "button";
      retry.addEventListener("click", function () { retryPending(e.id); });
      right.appendChild(retry);
    }
    right.appendChild(delButton("pend-del", "Discard " + e.text, function () { dropPending(e.id); }));

    var li = el("li", e.parked ? "failed" : "");
    li.appendChild(left);
    li.appendChild(right);
    pendingEl.appendChild(li);
  });
}

function pendingStatus(e) {
  var day = e.date === todayKey() ? "" : " · for " + e.date;
  if (e.id === activeId) return "estimating…" + day;
  if (e.parked) return e.error || "Failed.";
  if (!apiKey()) return "waiting for an API key" + day;
  if (!navigator.onLine) return "waiting for a connection" + day;
  if (e.error) return e.error + "\nWill retry.";
  return "pending" + day;
}

// ---------- actions ----------
function removeItem(id) {
  var days = loadDays();
  var key = todayKey();
  days[key] = (days[key] || []).filter(function (i) { return i.id !== id; });
  if (!saveDays(days)) showError(STORAGE_FAIL);
  render();
}

// Enqueue first, then try to send. Not "send, and queue on failure" — this way
// there is one path online and off, and a crash mid-request loses nothing.
function log() {
  var text = foodInput.value.trim();
  if (!text) return;

  var ok = updateQueue(function (q) {
    q.push({
      id: newId(),
      text: text,
      date: todayKey(),   // stamped now: a late send must not slide into the next day
      createdAt: new Date().toISOString(),
      attempts: 0,
      error: "",
      parked: false
    });
    return q;
  });
  if (!ok) { showError(STORAGE_FAIL); return; }

  foodInput.value = "";
  showError("");
  render();
  foodInput.focus();

  if (!apiKey()) {
    openSettings();
    showError("Add your API key — the entry is saved and will send once you do.");
    return;
  }
  drain();
}

function retryPending(id) {
  patchEntry(id, { parked: false, attempts: 0, error: "" });
  render();
  drain();
}

function dropPending(id) {
  updateQueue(function (q) {
    return q.filter(function (e) { return e.id !== id; });
  });
  render();
}

// Returns false if the write didn't land. Callers must stop rather than carry on
// against an entry whose state could not be recorded.
function patchEntry(id, patch) {
  var ok = updateQueue(function (q) {
    q.forEach(function (e) { if (e.id === id) Object.assign(e, patch); });
    return q;
  });
  if (!ok) showError(STORAGE_FAIL);
  return ok;
}

var draining = false;
var activeId = null;

// Works through the queue oldest-first, one at a time — keeps day-log order and
// avoids firing every queued request the instant a flaky connection returns.
async function drain() {
  if (draining) return;
  if (!apiKey()) return;
  draining = true;
  var didWork = false;
  // Backstop: if an entry comes round twice in one pass, its state failed to
  // persist (storage full) and retrying it would spin forever.
  var seen = {};

  try {
    while (true) {
      var next = loadQueue().filter(function (e) { return !e.parked; })[0];
      if (!next || seen[next.id]) break;
      seen[next.id] = true;
      didWork = true;

      activeId = next.id;
      render();

      var parsed = null, failure = null;
      try {
        parsed = await parseFood(next.text);
      } catch (err) {
        failure = err;
      }

      // The entry may have been discarded while the request was in flight.
      if (!loadQueue().some(function (e) { return e.id === next.id; })) continue;

      if (!failure) {
        if (!parsed.length) {
          if (!patchEntry(next.id, { error: "No food recognized — edit and retry.", parked: true })) break;
          continue;
        }
        var days = loadDays();
        days[next.date] = (days[next.date] || []).concat(parsed);
        if (!saveDays(days)) {
          // Leave it queued rather than dropping a parse we already paid for.
          if (!patchEntry(next.id, { error: STORAGE_FAIL, parked: true })) break;
          continue;
        }
        dropPending(next.id);
        continue;
      }

      var msg = failure.message || "Couldn't parse that — try rephrasing.";

      // "defer": the request never reached the provider, so it is not the entry's
      // fault and costs no attempt. Stop and wait for the next trigger.
      if (failure.retry === "defer") {
        patchEntry(next.id, { error: msg });
        break;
      }

      var attempts = (next.attempts || 0) + 1;
      var parked = failure.retry === "terminal" || attempts >= MAX_ATTEMPTS;
      if (!patchEntry(next.id, { attempts: attempts, error: msg, parked: parked })) break;
      if (!parked) break;  // transient — try again on the next trigger, not in a tight loop
    }
  } finally {
    draining = false;
    activeId = null;
    // Nothing changed if the queue was already empty, and a render there would
    // rebuild what is already on screen.
    if (didWork) render();
  }
}

// ---------- wiring ----------
logBtn.addEventListener("click", log);
foodInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    log();
  }
});

PROVIDER_IDS.forEach(function (id) {
  var opt = document.createElement("option");
  opt.value = id;
  opt.textContent = PROVIDERS[id].label;
  providerSelect.appendChild(opt);
});

// Fill the settings fields from whatever provider is selected in the dropdown.
function syncSettings() {
  var id = providerSelect.value;
  var p = PROVIDERS[id];
  keyInput.value = apiKey(id);
  keyInput.placeholder = p.keyHint;
  modelInput.value = localStorage.getItem(storageKey("model", id)) || "";
  modelInput.placeholder = p.model;
  var o = optsFor(id);
  thinkingSelect.value = o.thinking;
  effortInput.value = o.effort;
  effortOptions.innerHTML = "";
  (p.efforts || []).forEach(function (v) {
    var opt = document.createElement("option");
    opt.value = v;
    effortOptions.appendChild(opt);
  });
  settingsNote.textContent =
    "Your key is stored only in this browser (localStorage) and sent only to " +
    p.host + ". Requests go straight from your browser to the provider. " +
    "Model and effort are sent verbatim, and only when set. " +
    (p.effortNote || "");
}

function openSettings() {
  settingsEl.classList.add("open");
  providerSelect.value = provider();
  syncSettings();
  keyInput.focus();
}

$("settings-toggle").addEventListener("click", function () {
  if (settingsEl.classList.contains("open")) settingsEl.classList.remove("open");
  else openSettings();
});
providerSelect.addEventListener("change", syncSettings);

$("api-key-save").addEventListener("click", saveSettings);
[keyInput, modelInput, effortInput].forEach(function (el) {
  el.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); saveSettings(); }
  });
});
function saveSettings() {
  var id = providerSelect.value;
  if (!PROVIDERS[id]) return;
  var key = keyInput.value.trim();
  var model = modelInput.value.trim();
  var thinking = thinkingSelect.value;
  var effort = effortInput.value.trim();
  try {
    localStorage.setItem(KEY_PROVIDER, id);
    if (key) localStorage.setItem(storageKey("apiKey", id), key);
    setOrClear("model", id, model);
    setOrClear("thinking", id, thinking);
    setOrClear("effort", id, effort);
  } catch (e) {}
  if (!apiKey(id)) { keyInput.focus(); showError("Add your API key first."); return; }
  settingsEl.classList.remove("open");
  showError("");
  foodInput.focus();
  drain();  // a fresh key or model may be exactly what the queue was waiting for
}

goalShow.addEventListener("click", function () {
  goalInput.value = loadGoal();
  goalEdit.classList.add("open");
  goalInput.focus();
  goalInput.select();
});
$("goal-save").addEventListener("click", saveGoal);
goalInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); saveGoal(); }
});
function saveGoal() {
  var g = Math.max(1, Math.round(Number(goalInput.value) || loadGoal()));
  try { localStorage.setItem(KEY_GOAL, String(g)); } catch (e) {}
  goalEdit.classList.remove("open");
  render();
}

// first run: no key -> open settings
providerSelect.value = provider();
syncSettings();
if (!apiKey()) settingsEl.classList.add("open");
render();
drain();

// Drain triggers. iOS Safari has no Background Sync, so a queued entry can only
// be sent while the app is actually open — reopening it is the trigger that
// matters in practice.
document.addEventListener("visibilitychange", function () {
  // also re-renders at midnight rollover
  if (!document.hidden) { render(); drain(); }
});
window.addEventListener("online", function () { render(); drain(); });
// navigator.onLine only ever tells the truth when false (a captive portal still
// reports "online"), so it gates the note, never the drain — drain just tries.
window.addEventListener("offline", render);

// Service worker: caches the shell so the installed app opens without network.
// Parsing still needs the API — offline you can capture entries, not resolve them.
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}

// Every log lives only in this browser's localStorage. Ask iOS not to evict it.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(function () {});
}
</script>
</body>
</html>
