# GitHub Pages serves index.html straight off main — there is no build step —
# so this is the one place a deploy can bake anything in: after each push,
# rewrite BUILD_STAMP with the pushed commit's short SHA and commit date and
# push the result back for Pages to publish. Pushes made with the default
# GITHUB_TOKEN never retrigger workflows, so the stamp commit cannot loop; the
# guard below only covers a manual re-run landing on a stamp commit itself.
name: Stamp build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stamp:
    if: ${{ !startsWith(github.event.head_commit.message, 'Stamp build') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake commit SHA and date into index.html
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          date=$(TZ=Europe/Berlin git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          stamp="Build $sha · $date"
          sed -i "s|^var BUILD_STAMP = \".*\";$|var BUILD_STAMP = \"$stamp\";|" index.html
          # Fail the run loudly if the constant line ever stops matching —
          # a silently unstamped page would claim its last stamp forever.
          grep -qF "var BUILD_STAMP = \"$stamp\";" index.html
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Stamp build $sha"
          git push
